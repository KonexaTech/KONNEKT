
name: Build and Verify KONNEKT Android APK

on:
  workflow_dispatch:
    inputs:
      staging:
        description: Build an isolated staging APK
        type: boolean
        default: false
      ephemeral_staging_signing:
        description: Explicit fresh-install-only test build without stable signing; cannot guarantee updates
        type: boolean
        default: false
      staging_url:
        description: Optional staging Supabase URL (used when repository variable is absent)
        type: string
        default: ''
      staging_publishable_key:
        description: Optional staging publishable key only; never enter a secret or service-role key
        type: string
        default: ''
      staging_onesignal_app_id:
        description: Optional public staging OneSignal App ID only, never an API key
        type: string
        default: ''
      staging_turn_credentials_url:
        description: Optional authenticated staging turn-credentials function URL, no embedded secrets
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - 'App.jsx'
      - 'main.jsx'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'capacitor.config.ts'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'konnekt.svg'
      - 'konnekt-192.png'
      - 'konnekt-512.png'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      KONNEKT_BUILD_TARGET: ${{ inputs.staging && 'staging' || 'production' }}

    steps:
      - name: Check stable staging signing configuration
        if: ${{ inputs.staging && !inputs.ephemeral_staging_signing }}
        env:
          KONNEKT_STAGING_KEYSTORE_BASE64: ${{ secrets.KONNEKT_STAGING_KEYSTORE_BASE64 }}
          KONNEKT_STAGING_KEYSTORE_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEYSTORE_PASSWORD }}
          KONNEKT_STAGING_KEY_ALIAS: ${{ secrets.KONNEKT_STAGING_KEY_ALIAS }}
          KONNEKT_STAGING_KEY_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEY_PASSWORD }}
        run: |
          for NAME in KONNEKT_STAGING_KEYSTORE_BASE64 KONNEKT_STAGING_KEYSTORE_PASSWORD KONNEKT_STAGING_KEY_ALIAS KONNEKT_STAGING_KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Missing Actions secret: $NAME. An owner must configure stable signing."
              exit 1
            fi
          done
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build mobile website
        if: ${{ !inputs.staging }}
        run: npm run build:mobile

      - name: Build staging mobile website
        if: ${{ inputs.staging }}
        env:
          VITE_SUPABASE_URL: ${{ vars.KONNEKT_STAGING_SUPABASE_URL || inputs.staging_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KONNEKT_STAGING_SUPABASE_PUBLISHABLE_KEY || inputs.staging_publishable_key }}
          VITE_TURN_CREDENTIALS_URL: ${{ vars.KONNEKT_STAGING_TURN_CREDENTIALS_URL || inputs.staging_turn_credentials_url }}
          VITE_ONESIGNAL_APP_ID: ${{ vars.KONNEKT_STAGING_ONESIGNAL_APP_ID || inputs.staging_onesignal_app_id }}
        run: |
          node scripts/validate-staging-integrations.mjs
          npm run build:mobile -- --mode staging

      - name: Verify staging backend isolation
        if: ${{ inputs.staging }}
        env:
          VITE_SUPABASE_URL: ${{ vars.KONNEKT_STAGING_SUPABASE_URL || inputs.staging_url }}
        run: node scripts/verify-staging-bundle.mjs

      - name: Verify website assets
        run: |
          test -f dist/index.html
          echo "Website entry point exists."
          ls -la dist

      - name: Generate Android project
        run: npx cap add android

      - name: Install existing KONNEKT brand assets
        run: node scripts/android-assets.mjs

      - name: Configure optional call device permissions
        run: node scripts/android-permissions.mjs

      - name: Synchronise Capacitor
        run: npx cap sync android

      - name: Set Android 8 minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/variables.gradle")
          if not file.exists():
              raise SystemExit("Android variables.gradle was not generated.")

          content = file.read_text()
          pattern = r'(?m)^(\s*minSdkVersion\s*=\s*)\d+'

          updated, count = re.subn(
              pattern,
              r'\g<1>26',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not safely set minSdkVersion.")

          file.write_text(updated)
          print("Android minimum SDK set to 26.")
          PY

          grep -n "minSdkVersion" android/variables.gradle

      - name: Configure stable staging signing
        id: staging_signing
        if: ${{ inputs.staging && !inputs.ephemeral_staging_signing }}
        env:
          KONNEKT_STAGING_KEYSTORE_BASE64: ${{ secrets.KONNEKT_STAGING_KEYSTORE_BASE64 }}
          KONNEKT_STAGING_KEYSTORE_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEYSTORE_PASSWORD }}
          KONNEKT_STAGING_KEY_ALIAS: ${{ secrets.KONNEKT_STAGING_KEY_ALIAS }}
          KONNEKT_STAGING_KEY_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEY_PASSWORD }}
        run: node scripts/android-staging-signing.mjs

      - name: Build Android APK
        working-directory: android
        env:
          KONNEKT_STAGING_KEYSTORE_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEYSTORE_PASSWORD }}
          KONNEKT_STAGING_KEY_ALIAS: ${{ secrets.KONNEKT_STAGING_KEY_ALIAS }}
          KONNEKT_STAGING_KEY_PASSWORD: ${{ secrets.KONNEKT_STAGING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK file and signature
        env:
          EXPECTED_STAGING_CERTIFICATE: ${{ steps.staging_signing.outputs.certificate_sha256 }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          echo "APK exists and is not empty."

          zipinfo -t "$APK"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "Could not find Android APK signature verifier."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/konnekt-apk-signature.txt"
          cat "$RUNNER_TEMP/konnekt-apk-signature.txt"
          if [ -n "$EXPECTED_STAGING_CERTIFICATE" ]; then
            ACTUAL_CERTIFICATE="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' "$RUNNER_TEMP/konnekt-apk-signature.txt")"
            test "$ACTUAL_CERTIFICATE" = "$EXPECTED_STAGING_CERTIFICATE"
          fi

          echo "APK signature verification passed."

      - name: Record staging APK installation evidence
        if: ${{ inputs.staging }}
        env:
          KONNEKT_EXPECTED_PACKAGE: com.konnekt.staging
          EXPECTED_STAGING_CERTIFICATE: ${{ steps.staging_signing.outputs.certificate_sha256 }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          node scripts/android-apk-evidence.mjs android/app/build/outputs/apk/debug/app-debug.apk "$APKSIGNER" "$AAPT" android/app/build/outputs/apk/debug/apk-evidence.json

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.staging && (inputs.ephemeral_staging_signing && 'KONNEKT-Android-API26-Staging-Fresh-Install-Only' || 'KONNEKT-Android-API26-Staging-Stable') || 'KONNEKT-Android-API26-Test' }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/apk-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove staging keystore
        if: ${{ always() && inputs.staging && !inputs.ephemeral_staging_signing }}
        run: |
          if [ -n "$KONNEKT_SIGNING_KEYSTORE_PATH" ]; then
            rm -f -- "$KONNEKT_SIGNING_KEYSTORE_PATH"
          fi
          
