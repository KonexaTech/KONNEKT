
name: Deploy KONNEKT to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the website only after public-release acceptance is approved
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate code and regression tests
        run: npm run lint && npm test

      - name: Build KONNEKT
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Main may contain acceptance fixes while public release remains on HOLD.
    # A push still validates/builds, but publishing needs a separate owner action.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish KONNEKT
        id: deployment
        uses: actions/deploy-pages@v4
