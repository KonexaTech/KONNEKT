name: KONNEKT repair checks
on:
  pull_request:
  push:
    branches: ['repair/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
