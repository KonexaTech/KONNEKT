name: KONNEKT repair checks
on:
  pull_request:
  push:
    branches: ['repair/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies for high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Smoke-test the production website build
        run: KONNEKT_TEST_PREVIEW=1 node --test tests/browser/release-build.test.mjs
      - run: npm run build:mobile
      - name: Smoke-test the production mobile web bundle
        run: KONNEKT_TEST_PREVIEW=1 node --test tests/browser/release-build.test.mjs
      - run: npm run test:browser
